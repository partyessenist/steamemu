name: CI

# Build the emulator and run the ctest suite on every push / PR to the main
# lines. The generated surface (src/generated/*) is checked in, so a plain build
# needs no Python; the regen-drift job below re-runs tools/gen.py to prove the
# checked-in sources still match steam_api.json.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 64-bit: builds libsteam_api.so and runs the FULL suite
          # (the POSIX-only tests -- storage/http/config/sockets/leaderboard --
          # only build here).
          - name: linux-x64
            os: ubuntu-latest
            cmake_args: ""
          # Windows 64-bit: steam_api64.dll. Runs the portable subset of tests
          # (CMake gates the fork/socket tests behind NOT WIN32).
          - name: windows-x64
            os: windows-latest
            cmake_args: "-A x64"
          # Windows 32-bit: steam_api.dll -- many games are 32-bit, so this
          # exercises the 32-bit ABI (struct packing / __cdecl) that matters most.
          - name: windows-x86
            os: windows-latest
            cmake_args: "-A Win32"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  regen-drift:
    name: generated-sources-in-sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules, full history)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # oldversions.py reconstructs every historical interface version from
          # the SteamworksSDK submodule's git log, so it needs full (non-shallow)
          # history -- fetch-depth 0 propagates to the submodule clone too.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate and diff
        # Re-run the generator against the vendored SDK; if the checked-in
        # src/generated/* differs, someone edited generated code by hand or
        # forgot to commit a regen -- fail so it can't drift silently.
        run: |
          python3 tools/gen.py third_party/SteamworksSDK src/generated
          git diff --exit-code -- src/generated \
            || { echo "::error::src/generated is stale -- run 'cmake --build build --target regen' and commit."; exit 1; }
